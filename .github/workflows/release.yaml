name: Meles Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux deependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Linux
        run: |
          wails build -tags webkit2_41

      - name: Rename artifact
        run: |
          mv build/bin/* build/bin/mels-linux_${{github.ref_name}}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: mels-linux
          path: build/bin/mels-linux_${{github.ref_name}}

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Windows
        run: |
          wails build

      - name: Rename artifact
        shell: pwsh
        run: |
          Move-Item build/bin/*.exe build/bin/mels_win_${{github.ref_name}}.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mels-windows
          path: build/bin/mels_win_${{github.ref_name}}.exe

  release:
    name: Create Github Release
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: mels-linux
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mels-windows
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/mels-linux_${{github.ref_name}}
            release/mels_win_${{github.ref_name}}.exe
          generate_release_notes: false
